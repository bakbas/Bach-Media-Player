pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{js,jsx,ts,tsx,json,jsonc,css}"
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    typecheck:
      glob: "*.{ts,tsx}"
      run: pnpm exec tsc -p tsconfig.base.json --noEmit

commit-msg:
  commands:
    conventional:
      run: |
        head -n1 "{1}" | grep -Eq "^(feat|fix|chore|docs|refactor|perf|test|build|ci|revert)(\(.+\))?!?: .+" \
          || { echo "Commit message must follow Conventional Commits (feat|fix|chore|docs|refactor|perf|test|build|ci|revert)"; exit 1; }
