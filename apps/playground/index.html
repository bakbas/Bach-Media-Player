<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bach Media Player — Playground</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header>
      <h1>Bach Media Player</h1>
      <p class="tagline">Composable, themable, AI-native web media player — Phase 1 alpha.</p>
    </header>

    <main>
      <section class="stage" data-testid="stage">
        <bach-player id="player" src="https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" muted>
          <video slot="media" crossorigin playsinline></video>
          <bach-controls slot="controls">
            <bach-play-button></bach-play-button>
            <bach-progress></bach-progress>
            <bach-time></bach-time>
            <bach-volume></bach-volume>
            <bach-fullscreen-button></bach-fullscreen-button>
          </bach-controls>
        </bach-player>
      </section>

      <section class="panel">
        <h2>Theme</h2>
        <p class="muted">Click a preset or paste a JSON manifest. Manifests are validated before they touch the DOM.</p>
        <div class="theme-row">
          <button class="theme" data-theme="default" data-testid="theme-default">Default</button>
          <button class="theme" data-theme="cinematic" data-testid="theme-cinematic">Cinematic</button>
          <button class="theme" data-theme="minimal" data-testid="theme-minimal">Minimal</button>
          <button class="theme" data-theme="neon" data-testid="theme-neon">Neon</button>
        </div>
        <textarea id="theme-input" data-testid="theme-input" spellcheck="false" rows="8"></textarea>
        <div class="actions">
          <button id="apply-theme" data-testid="apply-theme">Apply manifest</button>
          <button id="reset-theme" data-testid="reset-theme">Reset</button>
        </div>
        <pre id="theme-output" data-testid="theme-output" aria-live="polite"></pre>
      </section>

      <section class="panel">
        <h2>Mode</h2>
        <label class="row">
          <input type="checkbox" id="headless-toggle" data-testid="headless-toggle" />
          <span>Headless (hides the default controls slot; state remains queryable)</span>
        </label>
        <pre id="state-output" data-testid="state-output" aria-live="polite"></pre>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
